<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페어틀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Nanum+Myeongjo&family=Noto+Sans+KR&family=Noto+Serif+KR&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--ink:#1a1a1a;--sub:#888;--line:#1a1a1a;--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:#cfcfcf;font-family:var(--font)}
#toolbar{position:sticky;top:0;z-index:100;background:#222;color:#fff;display:flex;gap:6px 12px;align-items:center;padding:6px 10px;flex-wrap:wrap;font:12px/1.3 system-ui,sans-serif}
#toolbar button,#toolbar select{background:#fff;color:#111;border:0;padding:4px 9px;font:inherit;cursor:pointer}
#toolbar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
#toolbar input[type=color]{width:24px;height:20px;padding:0;border:0;background:none;cursor:pointer}
#toolbar input[type=range]{width:70px}
#toolbar .g{display:flex;gap:6px;align-items:center;padding-right:12px;border-right:1px solid #555}
#toolbar .g:last-child{border:0}
#toolbar select{max-width:130px}
#stage{width:min(100vw - 16px,calc((100vh - 84px)*.75));margin:8px auto;container-type:inline-size}
#sheet{text-rendering:geometricPrecision;-webkit-text-size-adjust:none;position:relative;display:flex;aspect-ratio:3/4;background:var(--bg);color:var(--ink);font-size:1.25cqw;line-height:1.55;padding:3.6em 3.6em 3em;overflow:hidden;font-family:var(--font)}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.15;pointer-events:none}
.layout{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:3em;min-width:0}
.layout>section{min-width:0;display:flex;flex-direction:column}
[contenteditable]{outline:none}
[contenteditable]:hover{background:rgba(255,215,0,.15)}
[contenteditable]:focus{background:rgba(255,215,0,.28)}
.cur{outline:1px dashed #4a90e2!important;outline-offset:1px}

.img-slot{position:relative;background:rgba(0,0,0,.06);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#999;font-size:.9em;text-align:center}
.img-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-slot.nc{background:transparent}.img-slot.nc img{object-fit:contain}
.img-slot:hover{outline:1px dashed #888;outline-offset:-1px}

.head{display:flex;gap:1.6em;align-items:center}
.logo{width:6em;height:6em;flex:none}
.world{flex:1;min-height:4em}
.pairname{font-size:2.4em;font-weight:700;text-align:center;margin:.5em 0 .3em;line-height:1.3}

.profile{display:flex;gap:1.5em;align-items:flex-start;margin-top:1em}
.profile.rev{flex-direction:row-reverse}
.info{flex:1;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.3em 1.2em;margin-bottom:.8em}
.f{display:flex;gap:.6em}.f b{flex:none;min-width:2.6em}.f span{flex:1;min-height:1.5em}
.extra{border-top:1px solid var(--sub);border-bottom:1px solid var(--sub);padding:.6em .2em;min-height:5em;color:var(--sub)}

.idcard{width:13em;flex:none;border-radius:.7em;background:#333;color:#fff;padding:.8em .8em .9em;display:flex;flex-direction:column;align-items:center;gap:.6em;box-shadow:0 .3em .9em rgba(0,0,0,.28)}
.idcard .badge{width:2.4em;height:2.4em;flex:none}
.idcard .photo{width:84%;aspect-ratio:3/4;flex:none;background:var(--pbg,#4a4a4a)}
.img-slot.photo img{inset:auto;left:0;top:0;width:100%;height:auto;max-width:none;object-fit:fill}
.idcard .af{font-size:.95em;line-height:1.3;text-align:center;width:100%;min-height:1.3em;flex:none;opacity:.85}
.idcard .nm{font-weight:700;font-size:1.5em;line-height:1.2;text-align:center;width:100%;flex:none}

.recog{display:grid;grid-template-columns:1fr 2.4em 1fr;align-items:center;gap:.6em;margin:1.4em 0 .4em}
.recog .box{background:rgba(0,0,0,.045);padding:.6em .9em;min-height:5.2em}
.recog .box b{display:block;color:var(--sub)}
.recog .arr{text-align:center;font-size:2em;line-height:1}

.blank{flex:1;min-height:1em}

.chars{margin-top:.6em}
.char{display:flex;gap:1.2em;align-items:flex-start;margin-bottom:1em}
.char .num{width:4.6em;height:4.6em;flex:none}
.char .cb{flex:1;min-width:0}.char .cn{font-weight:700}.char .cd{color:#444;min-height:2.6em}

.tl{position:relative;padding-left:3.4em;flex:1;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:1.2em;top:0;bottom:0;width:1px;background:var(--line)}
.ev-list{flex:1;display:flex;flex-direction:column}
.ev{position:relative;flex:1;min-height:5em;margin-bottom:1.1em;display:flex}
.ev .smile{position:absolute;left:-3.2em;top:.7em;width:2em;height:2em;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'><circle cx='15' cy='15' r='14' fill='%23f4dc7c'/><circle cx='10.5' cy='12' r='1.3' fill='%23222'/><circle cx='19.5' cy='12' r='1.3' fill='%23222'/><path d='M10 17.5q5 4.5 10 0' fill='none' stroke='%23222' stroke-width='1.6' stroke-linecap='round'/></svg>") center/contain no-repeat}
.evbox{flex:1;padding:.7em 1em}
.evbox .t{font-weight:700}.evbox .t::after{content:".txt"}
.evbox .b{margin-top:.3em;color:#444;white-space:pre-wrap}

.rz{position:absolute;left:0;right:0;bottom:-.7em;height:.9em;cursor:ns-resize;display:none;z-index:15;touch-action:none}
.rz::after{content:"";position:absolute;left:30%;right:30%;top:.4em;height:2px;background:#4a90e2}
.ev:hover>.rz{display:block}
.hide-ui .rz{display:none!important}
.sticker{position:absolute;z-index:5;cursor:move;touch-action:none}
.sticker img{width:100%;display:block;pointer-events:none;user-select:none}
.sticker:hover{outline:1px dashed #4a90e2}
.sx,.sr{position:absolute;display:none;background:#4a90e2;color:#fff;width:1.6em;height:1.6em;font-size:.9em;line-height:1.6em;text-align:center;border:0;padding:0;cursor:pointer}
.sx{top:0;right:0;background:#d33}.sr{right:0;bottom:0;cursor:nwse-resize}
.sticker:hover .sx,.sticker:hover .sr{display:block}

.li{position:relative}
.ctl{position:absolute;top:-.5em;right:-.5em;display:none;gap:2px;z-index:20}
.li:hover>.ctl{display:flex}
.ctl button{width:1.7em;height:1.7em;border:0;background:#d33;color:#fff;font-size:.85em;padding:0;cursor:pointer}
.ctl .mv{background:#333}
.add{align-self:center;margin:.4em 0;background:none;border:1px dashed #888;color:#777;padding:.1em 1em;font:inherit;font-size:.9em;cursor:pointer}
.hide-ui .ctl,.hide-ui .add,.hide-ui .sx,.hide-ui .sr{display:none!important}
.hide-ui [contenteditable]:hover,.hide-ui [contenteditable]:focus{background:none}
.hide-ui .img-slot,.hide-ui .sticker{cursor:default}.hide-ui .img-slot:hover,.hide-ui .sticker:hover{outline:0}.hide-ui .ph{display:none}
#cropm{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;font:13px system-ui,sans-serif}
#cropm .cbx{background:#222;color:#fff;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
#cropm .cf{width:min(300px,60vw);aspect-ratio:3/4;background:var(--pbg,#4a4a4a);position:relative;overflow:hidden;cursor:grab;touch-action:none}
#cropm .cf img{position:absolute;max-width:none;height:auto;pointer-events:none;user-select:none}
#cropm .cr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#cropm button{border:0;padding:4px 10px;cursor:pointer;background:#fff;color:#111}
</style>
</head>
<body>
<div id="toolbar">
  <div class="g"><button id="bSave">저장</button><button id="bDl">HTML 다운로드</button><button id="bPrev">미리보기</button><button id="bReset">초기화</button></div>
  <div class="g"><button id="bImg">이미지 저장</button><select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option></select><select id="qs"><option value="2400">2400px</option><option value="3600" selected>3600px (고화질)</option><option value="4800">4800px</option></select></div>
  <div class="g"><button id="bSticker">+ 스티커</button></div>
  <div class="g">
    <label>배경색<input type="color" data-var="--bg" value="#f4f4f2"></label>
    <button id="bBg">배경 이미지</button>
    <label>투명도<input type="range" id="bgo" min="0" max="100" value="15"></label>
    <button id="bBgX">제거</button>
  </div>
  <div class="g">
    <label>전체 글꼴<select id="fontAll"></select></label>
    <label>기본 글자색<input type="color" data-var="--ink" value="#1a1a1a"></label>
    <label>보조색<input type="color" data-var="--sub" value="#888888"></label>
    <label>연표선<input type="color" data-var="--line" value="#1a1a1a"></label>
    <label>사진 배경색<input type="color" data-var="--pbg" value="#4a4a4a"></label>
  </div>
  <div class="g" title="요소를 클릭하거나 글자를 드래그한 뒤 적용">
    <b>선택 항목</b>
    <label>글자색<input type="color" id="cText" value="#1a1a1a"></label>
    <label>배경색<input type="color" id="cBg" value="#ffffff"></label>
    <label>글꼴<select id="fontSel"></select></label>
    <button class="fmt" data-c="bold"><b>B</b></button><button class="fmt" data-c="italic"><i>I</i></button><button class="fmt" data-c="underline"><u>U</u></button><button class="fmt" data-c="strikeThrough"><s>S</s></button>
    <button id="bClr">스타일 해제</button>
  </div>
</div>

<div id="stage"><main id="sheet">
  <div class="bgimg"></div>
  <div class="layout">
  <section>
    <div class="head">
      <div class="img-slot nc logo"><span class="ph">로고</span></div>
      <div class="world" contenteditable="true">세계관 설명을 입력하세요.</div>
    </div>

    <div class="profile">
      <div class="idcard">
        <div class="img-slot nc badge"><span class="ph">로고</span></div>
        <div class="img-slot photo"><span class="ph">증명사진</span></div>
        <div class="af" contenteditable="true">소속</div><div class="nm" contenteditable="true">이름</div>
      </div>
      <div class="info">
        <div class="fields">
          <div class="f"><b contenteditable="true">신체</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">가면</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">소속</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">직급</b><span contenteditable="true">-</span></div>
        </div>
        <div class="extra" contenteditable="true">부가 설명</div>
      </div>
    </div>

    <div class="recog">
      <div class="box"><b contenteditable="true">인식</b><div contenteditable="true">A → B</div></div>
      <div class="arr">⇅</div>
      <div class="box"><b contenteditable="true">인식</b><div contenteditable="true">B → A</div></div>
    </div>

    <div class="profile rev">
      <div class="idcard">
        <div class="img-slot nc badge"><span class="ph">로고</span></div>
        <div class="img-slot photo"><span class="ph">증명사진</span></div>
        <div class="af" contenteditable="true">소속</div><div class="nm" contenteditable="true">이름</div>
      </div>
      <div class="info">
        <div class="fields">
          <div class="f"><b contenteditable="true">신체</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">가면</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">소속</b><span contenteditable="true">-</span></div>
          <div class="f"><b contenteditable="true">직급</b><span contenteditable="true">-</span></div>
        </div>
        <div class="extra" contenteditable="true">부가 설명</div>
      </div>
    </div>

    <div class="blank"></div>

    <div class="chars">
      <div data-list class="char-list">
        <div class="char li"><div class="img-slot nc num"><span class="ph">1</span></div><div class="cb"><div class="cn" contenteditable="true">등장인물 1</div><div class="cd" contenteditable="true">설명을 입력하세요.</div></div></div>
        <div class="char li"><div class="img-slot nc num"><span class="ph">2</span></div><div class="cb"><div class="cn" contenteditable="true">등장인물 2</div><div class="cd" contenteditable="true">설명을 입력하세요.</div></div></div>
        <div class="char li"><div class="img-slot nc num"><span class="ph">3</span></div><div class="cb"><div class="cn" contenteditable="true">등장인물 3</div><div class="cd" contenteditable="true">설명을 입력하세요.</div></div></div>
      </div>
      <button class="add" data-add=".char-list">+ 등장인물</button>
    </div>
  </section>

  <section>
    <div class="tl">
      <div data-list class="ev-list">
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
        <div class="ev li"><span class="smile"></span><div class="evbox"><div class="t" contenteditable="true">제목</div><div class="b" contenteditable="true">내용을 입력하세요.</div></div></div>
      </div>
      <button class="add" data-add=".ev-list">+ 연표</button>
    </div>
  </section>
  </div>
</main></div>
<input type="file" id="pick" accept="image/*" hidden>

<script>
(function(){
const $=s=>document.querySelector(s),sheet=$('#sheet'),root=document.documentElement,pick=$('#pick');
const KEY='pair-sheet-v2',TK='pair-theme-v2',SEL='[contenteditable="true"],.idcard,.evbox,.box,.img-slot,.extra,.tl,.smile,.char,.profile';
const FONTS=['Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Serif KR','Nanum Gothic','Nanum Myeongjo','Batang','Dotum','Gulim','Gungsuh','Arial','Helvetica','Verdana','Tahoma','Trebuchet MS','Times New Roman','Georgia','Palatino','Garamond','Courier New','Impact','Comic Sans MS','serif','sans-serif','monospace','cursive'];
const GEN=['serif','sans-serif','monospace','cursive'],fam=n=>GEN.includes(n)?n:`"${n}",sans-serif`;
const preview=()=>document.body.classList.contains('hide-ui');
['#fontAll','#fontSel'].forEach(s=>{const e=$(s);e.innerHTML=(s==='#fontSel'?'<option value="">(선택)</option>':'')+FONTS.map(f=>`<option value="${f}" style="font-family:${fam(f)}">${f}</option>`).join('')});

/* theme */
const theme=JSON.parse(localStorage.getItem(TK)||'{}');
function setVar(k,v){root.style.setProperty(k,v);theme[k]=v;try{localStorage.setItem(TK,JSON.stringify(theme))}catch(e){}}
Object.entries(theme).forEach(([k,v])=>{if(k.startsWith('--'))root.style.setProperty(k,v)});
document.querySelectorAll('#toolbar input[data-var]').forEach(i=>{
  const v=theme[i.dataset.var];if(v&&/^#/.test(v))i.value=v;
  i.addEventListener('input',()=>setVar(i.dataset.var,i.value));
});
$('#fontAll').value=theme.fontName||'Pretendard';
$('#fontAll').onchange=e=>{theme.fontName=e.target.value;setVar('--font',fam(e.target.value))};

/* helpers */
function readImg(f,max,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=im.width*sc;cv.height=im.height*sc;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    cb(f.type==='image/jpeg'?cv.toDataURL('image/jpeg',.88):cv.toDataURL('image/png'));
  };im.src=r.result};r.readAsDataURL(f);
}
function choose(max,cb){pick.onchange=()=>{const f=pick.files[0];pick.value='';if(f)readImg(f,max,cb)};pick.click()}
function ctl(it){if(it.querySelector(':scope>.ctl'))return;const c=document.createElement('div');c.className='ctl';c.contentEditable='false';c.innerHTML='<button class="mv" data-a="u">↑</button><button class="mv" data-a="d">↓</button><button data-a="x">✕</button>';it.appendChild(c);if(it.classList.contains('ev')&&!it.querySelector(':scope>.rz')){const z=document.createElement('i');z.className='rz';z.contentEditable='false';it.appendChild(z)}}
const initCtl=()=>sheet.querySelectorAll('.li').forEach(ctl);

/* selection / current target */
let cur=null,saved=null;
function setCur(t){if(cur)cur.classList.remove('cur');cur=t;if(t)t.classList.add('cur')}
sheet.addEventListener('mousedown',e=>{if(!preview()&&!e.target.closest('.sticker'))setCur(e.target.closest(SEL))});
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&sheet.contains(s.anchorNode))saved=s.isCollapsed?null:s.getRangeAt(0).cloneRange()});
function apply(kind,val,live){
  if(saved){
    if(live)return;
    const n=saved.commonAncestorContainer,host=(n.nodeType===1?n:n.parentElement).closest('[contenteditable="true"]');
    if(host){host.focus();const s=getSelection();s.removeAllRanges();s.addRange(saved);
      document.execCommand('styleWithCSS',false,true);
      document.execCommand(kind==='color'?'foreColor':kind==='bg'?'hiliteColor':'fontName',false,kind==='font'?val:val);
      sched();return}
  }
  if(!cur)return;
  if(kind==='color')cur.style.color=val;else if(kind==='bg')cur.style.backgroundColor=val;else cur.style.fontFamily=fam(val);
  sched();
}
[['#cText','color'],['#cBg','bg']].forEach(([s,k])=>{const e=$(s);e.addEventListener('input',()=>apply(k,e.value,true));e.addEventListener('change',()=>apply(k,e.value,false))});
$('#fontSel').onchange=e=>{if(e.target.value)apply('font',e.target.value,false)};
$('#bClr').onclick=()=>{if(cur){cur.style.color=cur.style.backgroundColor=cur.style.fontFamily='';sched()}};

/* clicks */
sheet.addEventListener('click',e=>{
  if(preview())return;const t=e.target;
  if(t.classList.contains('sx')){t.closest('.sticker').remove();sched();return}
  const s=t.closest('.img-slot');
  if(s&&s.classList.contains('photo')){photoEd(s);return}
  if(s){choose(s.classList.contains('nc')?800:1000,u=>{s.querySelectorAll('img').forEach(x=>x.remove());const im=document.createElement('img');im.src=u;s.prepend(im);const p=s.querySelector('.ph');if(p)p.style.display='none';sched()});return}
  const b=t.closest('.ctl button');
  if(b){const it=b.closest('.li'),a=b.dataset.a;
    if(a==='x'&&confirm('삭제할까요?'))it.remove();
    if(a==='u'&&it.previousElementSibling)it.parentNode.insertBefore(it,it.previousElementSibling);
    if(a==='d'&&it.nextElementSibling)it.parentNode.insertBefore(it.nextElementSibling,it);
    sched();return}
  const ad=t.closest('.add');
  if(ad){const l=sheet.querySelector(ad.dataset.add),c=l.lastElementChild.cloneNode(true);c.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));l.appendChild(c);initCtl();sched()}
});

/* format */
const FM={bold:['fontWeight','700'],italic:['fontStyle','italic'],underline:['textDecoration','underline'],strikeThrough:['textDecoration','line-through']};
document.querySelectorAll('.fmt').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{
  if(saved){const n=saved.commonAncestorContainer,h=(n.nodeType===1?n:n.parentElement).closest('[contenteditable="true"]');
    if(h){h.focus();const g=getSelection();g.removeAllRanges();g.addRange(saved);document.execCommand('styleWithCSS',false,false);document.execCommand(b.dataset.c);sched();return}}
  if(cur){const[k,v]=FM[b.dataset.c];cur.style[k]=cur.style[k]===v?'':v;sched()}}});

/* photo crop */
function photoEd(s){
  const im0=s.querySelector('img'),o=document.createElement('div');o.id='cropm';
  o.innerHTML='<div class="cbx"><div class="cf"><img alt=""></div><div class="cr"><label>확대 <input type="range" min="20" max="400" value="100"></label><button data-a="n">사진 선택</button><button data-a="x">삭제</button><button data-a="o">적용</button><button data-a="c">취소</button></div><div>드래그로 위치 이동 · 빈 공간은 사진 배경색으로 채워져요</div></div>';
  document.body.appendChild(o);
  const f=o.querySelector('.cf'),im=f.firstChild,rg=o.querySelector('input'),fw=()=>f.clientWidth,fh=()=>f.clientHeight;
  let src,nw,nh,s0,x,y,w,d;
  const draw=()=>{im.style.left=x+'px';im.style.top=y+'px';im.style.width=w+'px'};
  function load(u,keep){const t=new Image();t.onload=()=>{src=u;nw=t.width;nh=t.height;s0=Math.max(fw()/nw,fh()/nh);
    if(keep&&im0&&im0.style.width){w=parseFloat(im0.style.width)/100*fw();x=parseFloat(im0.style.left)/100*fw();y=parseFloat(im0.style.top)/100*fh()}
    else{w=nw*s0;x=(fw()-w)/2;y=(fh()-w*nh/nw)/2}
    rg.value=Math.round(w/(nw*s0)*100);im.src=u;draw()};t.src=u}
  rg.oninput=()=>{const W=nw*s0*rg.value/100,cx=fw()/2,cy=fh()/2,k=W/w;x=cx-(cx-x)*k;y=cy-(cy-y)*k;w=W;draw()};
  f.onpointerdown=e=>{d={X:e.clientX,Y:e.clientY,x,y};f.setPointerCapture(e.pointerId)};
  f.onpointermove=e=>{if(d){x=d.x+e.clientX-d.X;y=d.y+e.clientY-d.Y;draw()}};
  f.onpointerup=()=>d=null;
  o.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==='n')choose(1600,u=>load(u));
    else if(a==='c')o.remove();
    else if(a==='x'){s.querySelectorAll('img').forEach(i=>i.remove());const p=s.querySelector('.ph');if(p)p.style.display='';o.remove();sched()}
    else if(a==='o'&&src){let i=s.querySelector('img');if(!i){i=document.createElement('img');s.prepend(i)}
      i.src=src;i.style.cssText=`left:${x/fw()*100}%;top:${y/fh()*100}%;width:${w/fw()*100}%`;
      const p=s.querySelector('.ph');if(p)p.style.display='none';o.remove();sched()}};
  if(im0)load(im0.src,true);else choose(1600,u=>load(u));
}

/* stickers */
function addSticker(u){
  const s=document.createElement('div');s.className='sticker';s.style.cssText='left:40%;top:40%;width:14%';
  s.innerHTML=`<img src="${u}" alt=""><button class="sx" contenteditable="false">✕</button><i class="sr"></i>`;
  sheet.appendChild(s);sched();
}
$('#bSticker').onclick=()=>choose(800,addSticker);
let drag=null;
sheet.addEventListener('pointerdown',e=>{
  if(preview())return;const st=e.target.closest('.sticker');if(!st||e.target.classList.contains('sx'))return;
  drag={st,m:!e.target.classList.contains('sr'),x:e.clientX,y:e.clientY,l:parseFloat(st.style.left),t:parseFloat(st.style.top),w:parseFloat(st.style.width),r:sheet.getBoundingClientRect()};
  st.setPointerCapture(e.pointerId);e.preventDefault();
});
sheet.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=(e.clientX-drag.x)/drag.r.width*100,dy=(e.clientY-drag.y)/drag.r.height*100;
  if(drag.m){drag.st.style.left=drag.l+dx+'%';drag.st.style.top=drag.t+dy+'%'}else drag.st.style.width=Math.max(2,drag.w+dx)+'%';
});
sheet.addEventListener('pointerup',()=>{if(drag){drag=null;sched()}if(rs){rs=null;sched()}});
let rs=null;
sheet.addEventListener('pointerdown',e=>{
  if(preview()||!e.target.classList.contains('rz'))return;
  const ev=e.target.parentElement,px=parseFloat(getComputedStyle(sheet).fontSize);
  rs={ev,px,y:e.clientY,h:ev.getBoundingClientRect().height/px};
  e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
sheet.addEventListener('pointermove',e=>{
  if(!rs)return;const h=Math.max(3,rs.h+(e.clientY-rs.y)/rs.px);
  rs.ev.style.flex='none';rs.ev.style.height=h+'em';
});

/* background */
const bg=()=>sheet.querySelector('.bgimg');
$('#bBg').onclick=()=>choose(1600,u=>{bg().style.backgroundImage=`url(${u})`;sched()});
$('#bBgX').onclick=()=>{bg().style.backgroundImage='';sched()};
$('#bgo').oninput=e=>{bg().style.opacity=e.target.value/100;sched()};

/* save/load */
sheet.addEventListener('input',sched);
sheet.addEventListener('paste',e=>{if(!e.target.closest('[contenteditable]'))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
let tm;function sched(){clearTimeout(tm);tm=setTimeout(save,600)}
function clean(){sheet.querySelectorAll('.ctl').forEach(x=>x.remove());sheet.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'))}
function save(){clean();try{localStorage.setItem(KEY,sheet.innerHTML)}catch(e){console.warn(e)}initCtl();if(cur)cur.classList.add('cur')}
try{const h=localStorage.getItem(KEY);if(h)sheet.innerHTML=h}catch(e){}
sheet.querySelectorAll('.pairname').forEach(x=>x.remove());sheet.querySelectorAll('.idcard .nm').forEach(n=>{if(!n.previousElementSibling||!n.previousElementSibling.classList.contains('af')){const a=document.createElement('div');a.className='af';a.contentEditable='true';a.textContent='소속';n.before(a)}});
initCtl();$('#bgo').value=Math.round((parseFloat(bg().style.opacity)||.15)*100);

$('#bSave').onclick=()=>{save();alert('저장했어요.')};
$('#bPrev').onclick=()=>{const on=document.body.classList.toggle('hide-ui');setCur(null);sheet.querySelectorAll('[contenteditable]').forEach(x=>x.contentEditable=on?'false':'true')};
$('#bReset').onclick=()=>{if(confirm('처음 상태로 되돌릴까요?')){localStorage.removeItem(KEY);localStorage.removeItem(TK);location.reload()}};
$('#bImg').onclick=async()=>{
  const b=$('#bImg'),was=preview();b.disabled=true;b.textContent='생성중...';
  try{
    if(!window.htmlToImage)await new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
    if(!was)$('#bPrev').click();clean();
    const jpg=$('#fmt').value==='jpg',fn=jpg?htmlToImage.toJpeg:htmlToImage.toPng,
      o={pixelRatio:$('#qs').value/sheet.offsetWidth,cacheBust:true,backgroundColor:getComputedStyle(sheet).backgroundColor,quality:.95};
    await fn(sheet,o);
    const a=document.createElement('a');a.href=await fn(sheet,o);a.download='pair.'+(jpg?'jpg':'png');a.click();
  }catch(e){alert('이미지 저장 실패: '+(e.message||e))}
  if(!was)$('#bPrev').click();initCtl();b.disabled=false;b.textContent='이미지 저장'};
$('#bDl').onclick=()=>{
  if(preview())$('#bPrev').click();clean();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+root.outerHTML],{type:'text/html'}));a.download='pair.html';a.click();
  initCtl();
};
})();
</script>
</body>
